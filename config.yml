# Download it here: https://black-minecraft.com/resources/10201/
# ╔══════════════════════════════════════════════════════════════╗
# ║              FunRTP — Конфигурационный файл                  ║
# ║  Поддерживаются цвета: &a, &c, &#RRGGBB, &x&R&R&G&G&B&B     ║
# ╚══════════════════════════════════════════════════════════════╝

# ─────────────────────────────────────────────────────────────────
# СЕКЦИЯ: menu — настройки инвентарного меню RTP
# ─────────────────────────────────────────────────────────────────
menu:

  # Заголовок инвентаря (отображается в верхней части окна)
  # Поддерживает цветовые коды &, &#RRGGBB и &x&R&R&G&G&B&B
  title: "&x&f&f&0&0&0&0&l●&r&x&f&f&6&6&0&0&l Случайная телепортация"

  # Размер инвентаря (кратно 9, от 9 до 54)
  # Рекомендуется 45 (5 рядов) — именно под такой размер настроена анимация
  size: 45

  # Включить анимацию открытия меню? (true / false)
  animation_enabled: true

  # Скорость анимации в тиках (1 тик = 0.05 сек, 20 тиков = 1 сек)
  # Чем меньше значение — тем быстрее анимация. Рекомендуется: 1–3
  animation_speed: 1

  # ───────────────────────────────────────────────────────────────
  # ПОДСЕКЦИЯ: animation — блоки, используемые в анимации открытия
  # Укажите названия материалов Minecraft (Material enum)
  # Список материалов: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
  # ───────────────────────────────────────────────────────────────
  animation:

    # Блок для рамки (первый кадр — внешняя граница меню)
    # По умолчанию: RED_STAINED_GLASS_PANE
    border_block: "RED_STAINED_GLASS_PANE"

    # Блок для волны (кадры 2–6 — заполнение внутри рамки)
    # По умолчанию: ORANGE_STAINED_GLASS_PANE
    wave_block: "ORANGE_STAINED_GLASS_PANE"

  # ───────────────────────────────────────────────────────────────
  # ПОДСЕКЦИЯ: items — настройка кнопок в меню RTP
  # Каждый пункт меню имеет: material, name, lore
  #   material — название блока/предмета (Material enum)
  #   name     — отображаемое имя (поддерживает цвета)
  #   lore     — список строк описания (поддерживает цвета)
  # ───────────────────────────────────────────────────────────────
  items:

    # Кнопка "Маленькая территория" (слот 13, тип SMALL — бесплатный)
    small:
      material: "GRASS_PATH"
      name: "&x&f&f&f&f&0&0✝ Маленькая территория"
      lore:
        - "&x&f&f&6&6&0&0➥ Нажмите&x&f&f&f&f&e&6, для телепортации"
        - ""
        - "&x&f&f&f&f&e&6Радиус: &x&f&f&f&f&0&0100–1000 блоков"
        - "&x&f&f&f&f&e&6Цена: &x&f&f&f&f&0&0Бесплатно"

    # Кнопка "Большая территория" (слот 20, тип BIG — платный)
    big:
      material: "GRASS_BLOCK"
      name: "&x&f&f&f&f&0&0✝ Большая территория"
      lore:
        - "&x&f&f&6&6&0&0➥ Нажмите&x&f&f&f&f&e&6, для телепортации"
        - ""
        - "&x&f&f&f&f&0&0＄&x&f&f&f&f&e&6 Цена:&x&f&f&f&f&0&0 250,000 Монет"

    # Кнопка "Нижний мир" (слот 24, тип NETHER — платный)
    nether:
      material: "CRIMSON_NYLIUM"
      name: "&x&f&f&f&f&0&0🔥 Нижний мир"
      lore:
        - "&x&f&f&6&6&0&0➥ Нажмите&x&f&f&f&f&e&6, для телепортации"
        - ""
        - "&x&f&f&f&f&0&0＄&x&f&f&f&f&e&6 Цена:&x&f&f&f&f&0&0 250,000 Монет"

    # Кнопка "Ближе к ивенту" (слот 31, тип EVENT — платный, требует активного ивента)
    event:
      material: "MYCELIUM"
      name: "&x&f&f&f&f&0&0☄ Ближе к ивенту"
      lore:
        - "&x&f&f&6&6&0&0➥ Нажмите&x&f&f&f&f&e&6, для телепортации"
        - ""
        - "&x&f&f&f&f&0&0＄&x&f&f&f&f&e&6 Цена:&x&f&f&f&f&0&0 250,000 Монет"

# ─────────────────────────────────────────────────────────────────
# СЕКЦИЯ: messages — все сообщения плагина
# Поддерживают цветовые коды & и &#RRGGBB
# ─────────────────────────────────────────────────────────────────
messages:

  # Сообщение при кулдауне. {time} — оставшееся время в секундах
  cooldown: "&cПожалуйста, подождите {time} секунд перед следующим RTP!"

  # Сообщение при отсутствии прав
  no_permission: "&cНедостаточно прав!"

  # Сообщение при попытке выполнить команду не игроком (из консоли)
  only_players: "Только для игроков!"

  # Сообщение, если указанный игрок не найден (для /funrtp teleport)
  player_not_found: "&cИгрок не найден!"

  # Сообщение, если не удалось найти безопасное место для телепортации
  safe_location_not_found: "&x&f&f&0&0&0&0[✘] Ошибка!&x&f&f&f&f&e&6 Не удалось найти безопасное место!"

  # Сообщение, если нет активных ивентов (при нажатии на кнопку EVENT)
  no_active_events: "&x&f&f&0&0&0&0[✘] Ошибка!&x&f&f&f&f&e&6 Сейчас нет активных &x&f&f&f&f&0&0Ивентов&x&f&f&f&f&e&6!"

  # Сообщение при нехватке денег для телепортации
  not_enough_money: "&x&f&f&0&0&0&0[✘] Ошибка!&x&f&f&f&f&e&6 Для покупки недостаточно &x&f&f&f&f&0&0Средств&x&f&f&f&f&e&6!"

  # Заголовок (title) при успешной телепортации
  teleport_success_title: "&#FF9B00У&#FFA700с&#FFB200п&#FFAE00е&#FFAA00ш&#FFAA00н&#FFAA00о"

  # Подзаголовок (subtitle) при успешной телепортации
  # {x}, {y}, {z} — координаты точки назначения
  teleport_success_subtitle: "&fX: {x} Y: {y} Z: {z}"

  # Сообщение администратору после успешной телепортации игрока
  # {player} — имя телепортированного игрока
  admin_teleport_success: "&aИгрок {player} успешно телепортирован!"

# ─────────────────────────────────────────────────────────────────
# СЕКЦИЯ: rtp — параметры телепортации
# ─────────────────────────────────────────────────────────────────
rtp:

  # Кулдаун между телепортациями в секундах
  # Игрок не сможет использовать RTP повторно до истечения этого времени
  cooldown_seconds: 90

  # ───────────────────────────────────────────────────────────────
  # ПОДСЕКЦИЯ: types — настройки каждого типа телепортации
  #   min_radius — минимальное расстояние от центра (в блоках)
  #   max_radius — максимальное расстояние от центра (в блоках)
  #   price      — цена телепортации (0 = бесплатно, требует Vault)
  # ───────────────────────────────────────────────────────────────
  types:

    # Тип SMALL — Маленькая территория (бесплатно, обычный мир)
    small:
      min_radius: 100
      max_radius: 1000
      price: 0

    # Тип BIG — Большая территория (платно, обычный мир, большой радиус)
    big:
      min_radius: 100
      max_radius: 2500
      price: 250000

    # Тип NETHER — Нижний мир (платно, телепортация в world_nether)
    nether:
      min_radius: 100
      max_radius: 1000
      price: 250000

    # Тип EVENT — Ближе к ивенту (платно, требует плагин FunEvents или SpookyEvents)
    # Телепортирует в радиусе от активного ивента
    event:
      min_radius: 100
      max_radius: 300
      price: 250000
